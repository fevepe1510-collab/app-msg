<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no"><meta name="theme-color" content="#070a09">
<link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icon.svg"><title>Sudoku</title>
<style>
:root{--bg:#070a09;--p:#0e1512;--p2:#151e1a;--line:#26352f;--txt:#f5f7f6;--mut:#8b9a93;--g:#20e58f;--r:#ff686d}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,Segoe UI,sans-serif}button,input{font:inherit}button{cursor:pointer}.app{width:min(100%,460px);min-height:100dvh;margin:auto;position:relative}.v{display:none;min-height:100dvh}.v.on{display:flex;flex-direction:column}.head{display:flex;gap:10px;align-items:center;padding:14px;border-bottom:1px solid var(--line)}.head b{flex:1}.ico{width:42px;height:42px;border:1px solid var(--line);border-radius:13px;background:var(--p);color:#fff}.pad{padding:16px}.stack{display:grid;gap:12px}.card{background:var(--p);border:1px solid var(--line);border-radius:18px;padding:16px}.in{width:100%;padding:13px;border-radius:13px;border:1px solid var(--line);background:#111916;color:#fff;outline:none}.btn{border:0;border-radius:13px;padding:13px 15px;background:var(--g);color:#052117;font-weight:800}.sec{background:var(--p2);color:#fff;border:1px solid var(--line)}.danger{background:#2b1013;color:#ff7a7f;border:1px solid #5a2529}.mut{color:var(--mut);font-size:13px}.err{color:#ff8589;font-size:13px}.ok{color:#8ff2bd;font-size:13px}.top{display:flex;align-items:center;padding:14px}.top h1{flex:1;text-align:center;font-size:22px;margin:0}.sudoku{padding:0 14px 24px}.meta{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;margin:5px 0 10px}.board{aspect-ratio:1;display:grid;grid-template-columns:repeat(9,1fr);border:2px solid #617067}.cell{display:grid;place-items:center;border:0;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#0a0f0d;color:#eef4f1;font-size:20px}.cell:nth-child(9n+3),.cell:nth-child(9n+6){border-right:2px solid #617067}.cell:nth-child(n+19):nth-child(-n+27),.cell:nth-child(n+46):nth-child(-n+54){border-bottom:2px solid #617067}.cell.g{background:#0d1512}.cell.s{background:#123429;outline:1px solid var(--g);outline-offset:-1px}.nums{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:18px}.num{padding:16px 0;border:1px solid var(--line);border-radius:13px;background:var(--p2);color:#fff;font-size:21px;font-weight:700}.tools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.tools button{padding:10px 4px;border:1px solid var(--line);border-radius:12px;background:var(--p);color:#dce5e1;font-size:12px}.list{padding:8px 10px 92px}.row{display:flex;gap:12px;align-items:center;padding:13px 8px;border-radius:15px}.row:active{background:var(--p)}.avatar{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:#16231e;border:1px solid #30443b;font-weight:800}.grow{flex:1;min-width:0}.name{font-weight:750}.preview{font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.center{display:grid;place-items:center;text-align:center;min-height:50vh}.msgs{flex:1;overflow:auto;padding:12px 12px 95px}.msg{display:flex;margin:8px 0}.msg.me{justify-content:flex-end}.bubble{max-width:82%;padding:10px 12px;border-radius:17px;background:#151d1a;border:1px solid #24332d}.me .bubble{background:#0c5e3d;border-color:#0e7650}.small{font-size:11px;color:#b0bcb6}.stamp{font-size:10px;color:#acb6b1;text-align:right;margin-top:5px}.compose{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px 10px max(10px,env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#080c0a}.compose input{flex:1;min-width:0}.photo{width:180px;min-height:110px;border:1px solid #2a3933;background:#0e1713;border-radius:14px;color:#d9eee4;display:grid;place-items:center;padding:10px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.94);z-index:100;display:none;align-items:center;justify-content:center;padding:20px}.modal.on{display:flex}.modal img{max-width:100%;max-height:80vh;border-radius:18px}.modal .ico{position:absolute;right:18px;top:18px}.user{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}.user:last-child{border-bottom:0}.wm{pointer-events:none;position:fixed;inset:0;z-index:50;opacity:.035;display:grid;grid-template-columns:repeat(3,1fr);gap:70px;padding:25px;overflow:hidden;transform:rotate(-27deg)}.wm span{white-space:nowrap;font-size:10px;font-weight:800}.blur{position:fixed;inset:0;z-index:120;background:#070a09;display:none;place-items:center}.blur.on{display:grid}
</style></head>
<body><div class="app">
<section id="sudoku" class="v on"><div class="top"><button class="ico">‹</button><h1>Sudoku</h1><button class="ico">⚙</button></div><div class="sudoku"><div class="meta"><span>Fácil</span><span id="timer">00:00</span></div><div id="board" class="board"></div><div class="tools"><button id="undo">↶<br>Deshacer</button><button id="erase">⌫<br>Borrar</button><button>✎<br>Notas</button><button>💡<br>Pista</button></div><div id="nums" class="nums"></div></div></section>
<section id="gate" class="v"><div class="head"><button class="ico" onclick="show('sudoku')">‹</button><b>Acceso privado</b></div><div class="pad"><div id="gateCard" class="card stack"></div></div></section>
<section id="chats" class="v"><div class="head"><b style="font-size:23px">Privado</b><button id="adminBtn" class="ico">⚙</button><button id="lockBtn" class="ico">🔒</button></div><div id="chatList" class="list"></div></section>
<section id="chat" class="v"><div class="head"><button class="ico" onclick="backChats()">‹</button><div id="cAv" class="avatar">P</div><b id="cTitle">Chat</b><button id="delConv" class="ico">⋯</button></div><div id="messages" class="msgs"></div><div class="compose"><button id="photoBtn" class="ico">＋</button><input id="msgIn" class="in" placeholder="Escribe un mensaje..."><button id="send" class="btn">➤</button></div></section>
<section id="admin" class="v"><div class="head"><button class="ico" onclick="backChats()">‹</button><b>Panel del propietario</b></div><div class="pad stack"><div><div class="mut" style="margin-bottom:7px">USUARIOS</div><div id="users" class="card"></div><button id="addUser" class="btn" style="width:100%;margin-top:10px">Crear usuario</button></div><div class="card stack"><b>Crear grupo</b><input id="gTitle" class="in" placeholder="Nombre del grupo"><div id="gUsers"></div><button id="mkGroup" class="btn sec">Crear grupo</button></div><div class="card"><b>Privacidad</b><div class="mut" style="margin-top:6px">La app muestra marca de agua y oculta el contenido al pasar a segundo plano. Una PWA no puede bloquear capturas de pantalla de forma fiable.</div></div><button id="destroy" class="btn danger">Destruir toda la información</button></div></section>
<input id="file" type="file" accept="image/*" hidden><div id="photoModal" class="modal"><button class="ico" onclick="closePhoto()">✕</button><img id="photoImg"></div><div id="wm" class="wm"></div><div id="blur" class="blur">🔒</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SB_URL='https://fqghgisywxnciuorpqim.supabase.co',SB_KEY='sb_publishable_LCeo6dxLwUUiAAVvgZ94zw_rcBCZnP1';
const db=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:false,autoRefreshToken:false}}),$=id=>document.getElementById(id),views=['sudoku','gate','chats','chat','admin'];
let token=localStorage.getItem('privado_session')||'',me=null,conv=null,poll=null,sel=null,hist=[],n9=0,once=false;
function show(id){views.forEach(v=>$(v).classList.toggle('on',v===id));if(id==='sudoku')stopPoll()}
function e(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function ini(s){return (s||'P').split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase()}
async function rpc(fn,args={}){const {data,error}=await db.rpc(fn,args);if(error)throw error;return data}
function msgErr(x){const m=(x?.message||String(x||'Error')).replace(/^.*P0001:\s*/,'');return ({INVALID_LOGIN:'Identificador o PIN incorrecto.',OWNER_ALREADY_EXISTS:'El propietario ya existe.',INVALID_IDENTIFIER:'Identificador inválido.',INVALID_PIN:'El PIN debe tener entre 6 y 12 números.',FORBIDDEN:'No tienes permiso.',UNAUTHORIZED:'La sesión venció.',MAX_USERS_REACHED:'Máximo 2 invitados.',IDENTIFIER_EXISTS:'Ese identificador ya existe.',PHOTO_TOO_LARGE:'La foto es demasiado pesada.',ALREADY_VIEWED:'Esta foto ya fue vista.',USER_NOT_FOUND:'Ese usuario ya no existe.'})[m]||m}
const puz=[5,3,0,0,7,0,0,0,0,6,0,0,1,9,5,0,0,0,0,9,8,0,0,0,0,6,0,8,0,0,0,6,0,0,0,3,4,0,0,8,0,3,0,0,1,7,0,0,0,2,0,0,0,6,0,6,0,0,0,0,2,8,0,0,0,0,4,1,9,0,0,5,0,0,0,0,8,0,0,7,9];
function build(){const b=$('board');b.innerHTML='';puz.forEach((v,i)=>{const x=document.createElement('button');x.className='cell'+(v?' g':'');x.textContent=v||'';if(!v)x.onclick=()=>{document.querySelectorAll('.cell').forEach(c=>c.classList.remove('s'));x.classList.add('s');sel=x};b.appendChild(x)});sel=[...b.children].find(x=>!x.classList.contains('g'));sel?.classList.add('s');$('nums').innerHTML=[1,2,3,4,5,6,7,8,9].map(n=>`<button class="num" data-n="${n}">${n}</button>`).join('')}
function put(n){if(n===9){if(++n9===3){n9=0;openGate();return}}else n9=0;if(sel){hist.push([sel,sel.textContent]);sel.textContent=n}}
build();$('nums').onclick=x=>{const b=x.target.closest('[data-n]');if(b)put(+b.dataset.n)};$('erase').onclick=()=>{n9=0;if(sel){hist.push([sel,sel.textContent]);sel.textContent=''}};$('undo').onclick=()=>{n9=0;const h=hist.pop();if(h){h[0].textContent=h[1];sel=h[0]}};let st=Date.now();setInterval(()=>{let s=Math.floor((Date.now()-st)/1000);$('timer').textContent=String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')},1000);
async function openGate(){stopPoll();show('gate');$('gateCard').innerHTML='<span class="mut">Comprobando...</span>';try{const s=await rpc('app_status');if(!s.configured){$('gateCard').innerHTML='<b>Configurar propietario</b><div class="mut">Hazlo una sola vez en tu teléfono.</div><input id="oName" class="in" placeholder="Tu nombre"><input id="oId" class="in" placeholder="Identificador privado"><input id="oPin" type="password" inputmode="numeric" class="in" placeholder="PIN de 6 a 12 números"><div id="gErr" class="err"></div><button id="boot" class="btn">Crear propietario</button>';$('boot').onclick=boot;return}if(token){try{me=await rpc('app_me',{p_session_token:token});return enter()}catch{token='';localStorage.removeItem('privado_session')}}loginForm()}catch(x){$('gateCard').innerHTML='<div class="err">'+e(msgErr(x))+'</div>'}}
async function boot(){try{await rpc('app_bootstrap_owner',{p_identifier:$('oId').value,p_display_name:$('oName').value,p_pin:$('oPin').value});await login($('oId').value,$('oPin').value)}catch(x){$('gErr').textContent=msgErr(x)}}
function loginForm(){$('gateCard').innerHTML='<b>Entrar</b><input id="lId" class="in" placeholder="Identificador"><input id="lPin" type="password" inputmode="numeric" class="in" placeholder="PIN"><div id="gErr" class="err"></div><button id="login" class="btn">Entrar</button>';$('login').onclick=async()=>{try{await login($('lId').value,$('lPin').value)}catch(x){$('gErr').textContent=msgErr(x)}}}
async function login(id,pin){const d=await rpc('app_login',{p_identifier:id,p_pin:pin});token=d.session_token;me=d.user;localStorage.setItem('privado_session',token);enter()}
async function enter(){show('chats');watermark();await loadChats();stopPoll();poll=setInterval(()=>{if($('chats').classList.contains('on'))loadChats(false)},2500)}
function stopPoll(){if(poll)clearInterval(poll);poll=null}
async function loadChats(wait=true){if(wait)$('chatList').innerHTML='<div class="center mut">Cargando...</div>';try{const a=await rpc('app_conversations_list',{p_session_token:token});$('chatList').innerHTML=a.length?a.map(c=>`<div class="row" data-id="${c.id}" data-title="${e(c.title)}"><div class="avatar">${ini(c.title)}</div><div class="grow"><div class="name">${e(c.title)}</div><div class="preview">${c.last_message?(c.last_message.message_type==='photo'?'📷 Foto':e(c.last_message.body||'')):'Sin mensajes'}</div></div></div>`).join(''):`<div class="center"><div><b>No hay conversaciones</b><div class="mut" style="margin-top:6px">${me?.role==='owner'?'Crea un usuario desde ⚙.':'El propietario aún no ha creado tu conversación.'}</div></div></div>`;document.querySelectorAll('.row[data-id]').forEach(r=>r.onclick=()=>openChat(r.dataset.id,r.dataset.title))}catch(x){if(msgErr(x).includes('sesión'))lock()}}
async function openChat(id,title){conv={id,title};$('cTitle').textContent=title;$('cAv').textContent=ini(title);show('chat');await loadMsgs();stopPoll();poll=setInterval(loadMsgs,2000)}
async function backChats(){stopPoll();conv=null;show('chats');await loadChats();poll=setInterval(()=>loadChats(false),2500)}window.backChats=backChats;
async function loadMsgs(){if(!conv)return;try{const a=await rpc('app_messages_list',{p_session_token:token,p_conversation_id:conv.id}),box=$('messages'),near=box.scrollHeight-box.scrollTop-box.clientHeight<140;box.innerHTML=a.map(m=>{let mine=m.sender_id===me.id,body=m.message_type==='text'?e(m.body):(m.photo_available?`<button class="photo" data-p="${m.id}">${m.view_once?'◉ Ver una sola vez':'📷 Abrir foto'}</button>`:'<div class="photo">Foto no disponible</div>');return `<div class="msg ${mine?'me':''}"><div class="bubble">${!mine?`<div class="small">${e(m.sender_name)}</div>`:''}${body}<div class="stamp">${new Date(m.created_at).toLocaleTimeString('es-CO',{hour:'2-digit',minute:'2-digit'})}</div></div></div>`}).join('');document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>openPhoto(b.dataset.p));if(near||!box.dataset.x){box.scrollTop=box.scrollHeight;box.dataset.x='1'}}catch(x){console.log(x)}}
async function send(){let t=$('msgIn').value.trim();if(!t||!conv)return;$('msgIn').value='';try{await rpc('app_message_send_text',{p_session_token:token,p_conversation_id:conv.id,p_body:t});loadMsgs()}catch(x){alert(msgErr(x))}}$('send').onclick=send;$('msgIn').onkeydown=x=>{if(x.key==='Enter')send()};
$('photoBtn').onclick=()=>{$('file').click()};$('file').onchange=async x=>{const f=x.target.files?.[0];if(!f||!conv)return;try{const z=await compress(f);once=confirm('¿Enviar para ver una sola vez?');await rpc('app_message_send_photo',{p_session_token:token,p_conversation_id:conv.id,p_photo_data:z.data,p_photo_mime:'image/jpeg',p_view_once:once});loadMsgs()}catch(q){alert(msgErr(q))}x.target.value=''};
async function compress(f){const url=URL.createObjectURL(f),im=new Image();await new Promise((a,b)=>{im.onload=a;im.onerror=b;im.src=url});let sc=Math.min(1,1280/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*sc);c.height=Math.round(im.height*sc);c.getContext('2d').drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(url);let q=.76,d=c.toDataURL('image/jpeg',q);while(d.length>1350000&&q>.4){q-=.08;d=c.toDataURL('image/jpeg',q)}if(d.length>1400000)throw Error('PHOTO_TOO_LARGE');return{data:d.split(',')[1]}}
async function openPhoto(id){try{const p=await rpc('app_photo_open',{p_session_token:token,p_message_id:id});$('photoImg').src=`data:${p.photo_mime};base64,${p.photo_data}`;$('photoModal').classList.add('on')}catch(x){alert(msgErr(x));loadMsgs()}}function closePhoto(){$('photoModal').classList.remove('on');$('photoImg').src='';loadMsgs()}window.closePhoto=closePhoto;
$('adminBtn').onclick=()=>{if(me?.role==='owner')openAdmin();else alert('Solo el propietario puede abrir este panel.')};async function openAdmin(){stopPoll();show('admin');await users()}
async function users(){try{const a=await rpc('app_users_list',{p_session_token:token});$('users').innerHTML=a.length?a.map(u=>`<div class="user openContact" data-id="${u.id}" data-name="${e(u.display_name)}" style="cursor:pointer"><div class="avatar">${ini(u.display_name)}</div><div class="grow"><b>${e(u.display_name)}</b><div class="mut">@${e(u.identifier)} · ${u.active?'Activo':'Bloqueado'}</div></div><div style="display:flex;gap:6px;flex-direction:column"><button class="btn sec tog" data-id="${u.id}" data-a="${u.active}">${u.active?'Bloquear':'Activar'}</button><button class="btn danger delUser" data-id="${u.id}" data-name="${e(u.display_name)}">Eliminar</button></div></div>`).join(''):'<span class="mut">No hay usuarios creados.</span>';document.querySelectorAll('.tog').forEach(b=>b.onclick=async()=>{await rpc('app_user_set_active',{p_session_token:token,p_user_id:b.dataset.id,p_active:b.dataset.a!=='true'});users()});document.querySelectorAll('.openContact').forEach(r=>r.onclick=async(ev)=>{if(ev.target.closest('button'))return;try{const d=await rpc('app_direct_conversation_for_user',{p_session_token:token,p_user_id:r.dataset.id});openChat(d.conversation_id,d.title||r.dataset.name)}catch(x){alert(msgErr(x))}});document.querySelectorAll('.delUser').forEach(b=>b.onclick=async()=>{if(!confirm('¿Eliminar a '+b.dataset.name+'? Se borrarán su acceso, su chat privado y sus mensajes.'))return;try{await rpc('app_user_delete',{p_session_token:token,p_user_id:b.dataset.id});await users();await loadChats(false)}catch(x){alert(msgErr(x))}});$('gUsers').innerHTML=a.filter(u=>u.active).map(u=>`<label class="user"><input type="checkbox" value="${u.id}"><span>${e(u.display_name)}</span></label>`).join('')||'<span class="mut">Crea usuarios primero.</span>'}catch(x){alert(msgErr(x))}}
$('addUser').onclick=()=>{if($('newUser'))return;$('users').insertAdjacentHTML('afterbegin','<div id="newUser" class="stack" style="padding-bottom:13px"><input id="uName" class="in" placeholder="Nombre visible"><input id="uId" class="in" placeholder="Identificador único"><input id="uPin" type="password" inputmode="numeric" class="in" placeholder="PIN de 6 a 12 números"><div id="uErr" class="err"></div><button id="uSave" class="btn">Guardar usuario</button></div>');$('uSave').onclick=async()=>{try{await rpc('app_user_create',{p_session_token:token,p_identifier:$('uId').value,p_display_name:$('uName').value,p_pin:$('uPin').value});users()}catch(x){$('uErr').textContent=msgErr(x)}}};
$('mkGroup').onclick=async()=>{const ids=[...$('gUsers').querySelectorAll('input:checked')].map(x=>x.value);if(!ids.length)return alert('Selecciona al menos un usuario.');try{await rpc('app_group_create',{p_session_token:token,p_title:$('gTitle').value,p_member_ids:ids});alert('Grupo creado.');$('gTitle').value='';users()}catch(x){alert(msgErr(x))}};
$('destroy').onclick=async()=>{if(!confirm('¿Eliminar todos los chats y usuarios invitados?'))return;if(!confirm('Confirmación final: ¿destruir toda la información?'))return;try{await rpc('app_destroy_all_data',{p_session_token:token});alert('Información eliminada.');users()}catch(x){alert(msgErr(x))}};
$('delConv').onclick=async()=>{if(me?.role!=='owner'||!conv)return;if(!confirm('¿Eliminar esta conversación?'))return;try{await rpc('app_conversation_delete',{p_session_token:token,p_conversation_id:conv.id});backChats()}catch(x){alert(msgErr(x))}};
async function lock(){try{if(token)await rpc('app_logout',{p_session_token:token})}catch{}token='';me=null;localStorage.removeItem('privado_session');show('sudoku')}$('lockBtn').onclick=lock;
function watermark(){const w=$('wm');w.innerHTML='';for(let i=0;i<36;i++){let s=document.createElement('span');s.textContent=(me?.identifier||'PRIVADO')+' · '+new Date().toLocaleDateString('es-CO');w.appendChild(s)}}document.addEventListener('visibilitychange',()=>{$('blur').classList.toggle('on',document.visibilityState!=='visible')});document.addEventListener('copy',x=>x.preventDefault());document.body.style.userSelect='none';
if('serviceWorker'in navigator)navigator.serviceWorker.register('/sw.js').catch(()=>{});
</script></body></html>
